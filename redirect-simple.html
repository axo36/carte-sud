<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirection…</title>
<link rel="preconnect" href="https://yueskrpxwvgwvbgmctru.supabase.co" crossorigin>
<style>
  html,body{margin:0;height:100%;background:#061710;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;}
  .spinner{width:32px;height:32px;border:3px solid rgba(52,211,153,0.2);border-top-color:#34d399;border-radius:50%;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
  <div class="spinner"></div>

<script>
  // ============================================================
  // CONFIGURATION — mêmes valeurs que dashboard.html
  // ============================================================
  const SUPABASE_URL = 'https://yueskrpxwvgwvbgmctru.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_CApGDmos5-0TOiim7xDcIQ_5Jo8xFSi';
  const SUPABASE_SCHEMA = 'creo';

  // Où envoyer les gens si aucun ?id= n'est présent, ou si tout échoue
  const DEFAULT_DESTINATION = "https://www.augresdusud.com/";

  // Temps max qu'on attend Supabase avant de partir sur le lien par défaut
  const MAX_WAIT_MS = 1500;

  function getParam(name){
    return new URLSearchParams(window.location.search).get(name);
  }

  function withTimeout(promise, ms){
    return Promise.race([
      promise,
      new Promise(resolve => setTimeout(() => resolve(null), ms)),
    ]);
  }

  // Cherche l'idée par son id, récupère juste le lien de destination.
  // Le lien est stocké côté serveur (Supabase) — modifiable à tout moment
  // depuis le dashboard, sans jamais toucher à ce fichier.
  async function getIdea(id){
    try{
      const res = await fetch(
        `${SUPABASE_URL}/rest/v1/ideas?id=eq.${encodeURIComponent(id)}&select=id,destination_url&limit=1`,
        {
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
            'Accept-Profile': SUPABASE_SCHEMA,
          },
        }
      );
      if(!res.ok){
        const t = await res.text().catch(()=>'');
        console.warn('[creo] lecture idée échouée :', res.status, t);
        return null;
      }
      const rows = await res.json();
      return rows && rows.length ? rows[0] : null;
    }catch(e){
      console.warn('[creo] lecture idée échouée (réseau) :', e);
      return null;
    }
  }

  // Enregistre le clic en tâche de fond — jamais attendu avant de rediriger.
  function recordClick(ideaId){
    fetch(`${SUPABASE_URL}/rest/v1/click_events`, {
      method: 'POST',
      keepalive: true,
      headers: {
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
        'Content-Type': 'application/json',
        'Content-Profile': SUPABASE_SCHEMA,
        'Prefer': 'return=minimal',
      },
      body: JSON.stringify({ idea_id: ideaId }),
    }).then(res => {
      if(!res.ok) res.text().then(t => console.warn('[creo] clic non enregistré :', res.status, t));
    }).catch(err => console.warn('[creo] clic non enregistré (réseau) :', err));
  }

  function safeUrl(destination){
    try{
      const u = new URL(destination);
      if(u.protocol === 'http:' || u.protocol === 'https:') return u;
    }catch(e){ /* invalide */ }
    return new URL(DEFAULT_DESTINATION);
  }

  async function go(){
    const id = getParam('id');

    // Pas d'id du tout → direction le site par défaut, sans appel réseau.
    if(!id){
      window.location.replace(DEFAULT_DESTINATION);
      return;
    }

    const idea = await withTimeout(getIdea(id), MAX_WAIT_MS);

    if(idea) recordClick(idea.id); // jamais attendu, part en tâche de fond

    const destination = (idea && idea.destination_url) || DEFAULT_DESTINATION;
    window.location.replace(safeUrl(destination).toString());
  }

  go();
</script>
</body>
</html>
